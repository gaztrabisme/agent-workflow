<svg data-rk-stage="chart" xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Scatterplot template</title>
  <desc id="desc">Example points map two quantitative fields to horizontal and vertical position.</desc>
  <rect width="960" height="600" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#191919">
    <text x="72" y="54" font-size="26" font-weight="700">Compare two measures</text>
    <text x="72" y="82" font-size="14">ILLUSTRATIVE VALUES — replace labels, units and ranges</text>
    <g data-rk-chart="scatter" data-rk-x-scale="linear" data-rk-x-domain="0,100" data-rk-x-range="110,870" data-rk-y-scale="linear" data-rk-y-domain="0,100" data-rk-y-range="470,120">
      <circle cx="186" cy="400" r="7" fill="#245c73" data-rk-mark="point" data-rk-x="10" data-rk-y="20" data-rk-series="Observations"/>
      <circle cx="338" cy="330" r="7" fill="#245c73" data-rk-mark="point" data-rk-x="30" data-rk-y="40" data-rk-series="Observations"/>
      <circle cx="490" cy="260" r="7" fill="#245c73" data-rk-mark="point" data-rk-x="50" data-rk-y="60" data-rk-series="Observations"/>
      <circle cx="642" cy="225" r="7" fill="#245c73" data-rk-mark="point" data-rk-x="70" data-rk-y="70" data-rk-series="Observations"/>
      <g data-rk-focal="data-graphic"><circle cx="794" cy="155" r="10" fill="#245c73" stroke="#191919" stroke-width="2" data-rk-mark="point" data-rk-x="90" data-rk-y="90" data-rk-series="Observations"/><text x="810" y="160" fill="#191919" font-size="12">High on both</text></g>
    </g>
    <path d="M110 120V470H870" fill="none" stroke="#555" stroke-width="2"/>
    <text x="420" y="525" font-size="16">Horizontal measure (unit)</text><text x="30" y="300" font-size="16" transform="rotate(-90 30 300)">Vertical measure (unit)</text>
    <text x="72" y="574" font-size="12">Source: replace with source; name units and explain selection</text>
  </g>
</svg>
