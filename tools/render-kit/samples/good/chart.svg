<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">Quarterly output comparison</title>
  <rect width="960" height="540" fill="#ffffff" />
  <g data-rk-chart data-rk-x-scale="linear" data-rk-x-domain="0,4" data-rk-x-range="100,860" data-rk-y-scale="linear" data-rk-y-domain="0,100" data-rk-y-range="450,70">
    <text x="100" y="45" font-family="sans-serif" font-size="24" fill="#18212b">Output index</text>
    <line x1="100" y1="450" x2="860" y2="450" stroke="#52606d" stroke-width="2" />
    <rect id="q1" data-rk-mark data-rk-x="1" data-rk-y="68" data-rk-y0="0" data-rk-series="North" x="230" y="191.6" width="120" height="258.4" fill="#0072B2" />
    <rect id="q2" data-rk-mark data-rk-x="3" data-rk-y="84" data-rk-y0="0" data-rk-series="South" x="610" y="130.8" width="120" height="319.2" fill="#E69F00" />
    <text x="230" y="490" font-family="sans-serif" font-size="20" fill="#18212b">North</text>
    <text x="610" y="490" font-family="sans-serif" font-size="20" fill="#18212b">South</text>
  </g>
</svg>
