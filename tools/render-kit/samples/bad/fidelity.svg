<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" role="img" aria-labelledby="t"><title id="t">Bar values and positions</title><rect width="700" height="440" fill="white"/><g data-rk-chart data-rk-x-scale="linear" data-rk-x-domain="0,10" data-rk-x-range="100,600" data-rk-y-scale="linear" data-rk-y-domain="0,100" data-rk-y-range="380,80"><rect id="correct" data-rk-mark data-rk-y="70" data-rk-y0="0" x="180" y="170" width="90" height="210" fill="#0072b2"/><rect id="wrong" data-rk-mark data-rk-y="50" data-rk-y0="0" x="400" y="210" width="90" height="170" fill="#e69f00"/></g></svg>
